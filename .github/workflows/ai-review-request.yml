name: Request AI review

on:
  pull_request_target:
    branches: [dev, main]
    types: [opened, reopened, ready_for_review, synchronize]

# This workflow deliberately never checks out or executes pull-request code.
permissions:
  pull-requests: write
  issues: write

jobs:
  request-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f "reviewers[]=sjungwon03-ai"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/assignees" \
            -f "assignees[]=${PR_AUTHOR}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=ai-review-requested"
