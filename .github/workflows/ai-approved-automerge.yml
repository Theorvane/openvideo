name: Auto-merge AI-approved pull requests

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Scheduled and manually dispatched runs execute from the trusted default branch.
# They only query GitHub metadata; pull-request code is never checked out or run.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for current-head AI approvals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          query='query { repository(owner: "'"${GITHUB_REPOSITORY%/*}"'", name: "'"${GITHUB_REPOSITORY#*/}"'") { pullRequests(first: 100, states: OPEN) { nodes { number isDraft baseRefName headRefOid reviews(last: 100) { nodes { state author { login } commit { oid } } } } } } }'
          gh api graphql -f query="$query" > pull-requests.json
          jq -r '
            .data.repository.pullRequests.nodes[]
            | . as $pr
            | select(.isDraft | not)
            | select(.baseRefName == "dev" or .baseRefName == "main")
            | select(any(.reviews.nodes[]; .state == "APPROVED" and .author.login == "sjungwon03-ai" and .commit.oid == $pr.headRefOid) )
            | .number
          ' pull-requests.json | while read -r number; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${number}/labels" -f 'labels[]=ai-approved'
            if gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -Fxq 'ai-review-requested'; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${number}/labels/ai-review-requested"
            fi
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
          done
