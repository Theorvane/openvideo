name: Auto-merge AI-approved pull requests

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  enable-automerge:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'sjungwon03-ai' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.pull_request.draft == false &&
      (github.event.pull_request.base.ref == 'dev' || github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Label and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=ai-approved"
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq ".labels[].name" | grep -Fxq "ai-review-requested"; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/ai-review-requested"
          fi
          if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge --delete-branch
          else
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
          fi
